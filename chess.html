<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <title>Шахматная доска</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #262522;
        --page-deep: #171714;
        --surface: #302f2b;
        --surface-soft: #393732;
        --ink: #f3efe5;
        --muted: #c8c0ae;
        --line: rgba(239, 228, 202, 0.18);
        --light-square: #cfc4ac;
        --dark-square: #615b50;
        --light-piece: #fbf7ec;
        --dark-piece: #171714;
        --accent: #bd9850;
        --accent-bright: #e8c676;
        --accent-deep: #755526;
        --move: rgba(224, 190, 106, 0.72);
        --select: #e4c26d;
        --danger: #a53f35;
        --board-frame: #191815;
        --shadow: rgba(0, 0, 0, 0.52);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #1c1c1a;
          --page-deep: #0c0c0b;
          --surface: #252421;
          --surface-soft: #2e2c28;
          --ink: #f4f0e7;
          --muted: #c4bba9;
          --line: rgba(239, 228, 202, 0.16);
          --light-square: #c9bea7;
          --dark-square: #555046;
          --board-frame: #10100f;
          --shadow: rgba(0, 0, 0, 0.7);
        }
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--page-deep); }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        font-family: "Montserrat", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 38% 23%, rgba(235, 221, 187, 0.1), transparent 34rem),
          linear-gradient(145deg, var(--page), var(--page-deep) 78%);
      }

      button, a { font: inherit; }

      .page {
        width: min(1180px, 100%);
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(22px, 4vw, 52px) clamp(16px, 4vw, 52px) calc(28px + env(safe-area-inset-bottom));
        display: grid;
        align-content: center;
      }

      .gallery {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
      }

      .chess-area { min-width: 0; }

      .site-nav {
        width: min(100%, 700px);
        margin: 0 auto 18px;
      }

      .site-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 10px 14px;
        color: var(--ink);
        background: transparent;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .site-link::before {
        content: "←";
        color: var(--accent-bright);
        font-size: 16px;
        font-weight: 500;
      }

      .site-link:hover,
      .site-link:focus-visible {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(232, 198, 118, 0.55);
        outline: none;
      }

      .opponent {
        width: min(100%, 700px);
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .opponent img {
        width: 58px;
        height: 58px;
        display: block;
        object-fit: cover;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border: 1px solid rgba(232, 198, 118, 0.28);
      }

      .opponent strong,
      .opponent span { display: block; }

      .opponent strong {
        color: var(--ink);
        font-size: 15px;
        letter-spacing: .04em;
      }

      .opponent span {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .control-row {
        width: min(100%, 700px);
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .turn-block { min-width: 0; }

      .turn-label {
        margin: 0;
        font-family: "Montserrat", sans-serif;
        font-size: clamp(24px, 3vw, 36px);
        line-height: 1.05;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .status {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .new-game {
        flex: 0 0 auto;
        appearance: none;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: transparent;
        color: var(--ink);
        padding: 11px 15px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .new-game:hover,
      .new-game:focus-visible {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(232, 198, 118, 0.55);
        outline: none;
      }

      .board-stage {
        position: relative;
        width: min(100%, 700px);
        margin: 0 auto;
        padding: clamp(13px, 2.1vw, 24px);
        background: var(--board-frame);
        border: 1px solid rgba(232, 198, 118, 0.2);
        box-shadow: 0 30px 70px var(--shadow), 0 2px 4px rgba(0,0,0,.35);
      }

      .board-stage::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(232, 198, 118, 0.12);
        pointer-events: none;
      }

      .board-grid {
        display: grid;
        grid-template-columns: clamp(20px, 3.2vw, 31px) minmax(0, 1fr) clamp(20px, 3.2vw, 31px);
        grid-template-rows: clamp(20px, 3.2vw, 31px) auto clamp(20px, 3.2vw, 31px);
        grid-template-areas:
          ". files-top ."
          "ranks-left board ranks-right"
          ". files-bottom .";
        align-items: stretch;
      }

      .board {
        grid-area: board;
        aspect-ratio: 1;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        border: 1px solid rgba(0,0,0,.72);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
        touch-action: manipulation;
      }

      .coordinates {
        display: grid;
        color: var(--accent-bright);
        font-size: clamp(12px, 1.8vw, 17px);
        font-weight: 700;
        line-height: 1;
        text-transform: lowercase;
        user-select: none;
      }

      .coordinates.files { grid-template-columns: repeat(8, 1fr); }
      .coordinates.ranks { grid-template-rows: repeat(8, 1fr); }
      .coordinates span { display: grid; place-items: center; }
      .files-top { grid-area: files-top; }
      .files-bottom { grid-area: files-bottom; }
      .ranks-left { grid-area: ranks-left; }
      .ranks-right { grid-area: ranks-right; }

      .square {
        position: relative;
        appearance: none;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      .square.light { background: var(--light-square); }
      .square.dark { background: var(--dark-square); }

      .square:focus-visible {
        outline: 3px solid var(--accent-bright);
        outline-offset: -3px;
        z-index: 4;
      }

      .piece {
        position: relative;
        z-index: 2;
        width: 88%;
        height: 88%;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .piece svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .piece.white { --piece-fill: var(--light-piece); }
      .piece.black { --piece-fill: var(--dark-piece); }

      .piece .main,
      .piece .deep {
        fill: var(--piece-fill);
        stroke: none;
      }

      .piece .highlight,
      .piece .accent,
      .piece .outline { display: none; }

      .square.selected::after {
        content: "";
        position: absolute;
        inset: 3px;
        border: clamp(3px, .55vw, 5px) solid var(--select);
        z-index: 3;
        pointer-events: none;
      }

      .square.legal::before {
        content: "";
        width: 24%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--move);
        box-shadow: 0 0 0 1px rgba(73,54,17,.25);
        z-index: 3;
        pointer-events: none;
      }

      .square.legal.capture::before {
        width: 72%;
        background: transparent;
        border: clamp(4px, .75vw, 7px) solid var(--move);
        box-shadow: none;
      }

      .square.last-move {
        box-shadow: inset 0 0 0 999px rgba(227, 194, 106, .22);
      }

      .square.in-check {
        box-shadow: inset 0 0 0 999px rgba(165, 63, 53, .48);
      }


      .promotion {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(8,8,7,.78);
      }

      .promotion.open { display: grid; }

      .promotion-panel {
        width: min(420px, 100%);
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 24px 70px rgba(0,0,0,.55);
      }

      .promotion h2 {
        margin: 0 0 18px;
        font-family: "Montserrat", sans-serif;
        font-size: 26px;
        font-weight: 500;
      }

      .promotion-options {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .promotion-options button {
        appearance: none;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--surface-soft);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 5px;
        cursor: pointer;
      }

      .promotion-options .piece { width: 72px; height: 72px; }

      .promotion-options button:hover,
      .promotion-options button:focus-visible {
        border-color: var(--accent-bright);
        background: rgba(232,198,118,.12);
        outline: none;
      }


      @media (max-width: 820px) {
        .page { align-content: start; }
      }

      @media (max-width: 520px) {
        .page { padding-left: 10px; padding-right: 10px; }
        .control-row { padding-inline: 6px; }
        .turn-label { font-size: 23px; }
        .status { font-size: 12px; }
        .new-game { padding: 9px 10px; font-size: 12px; }
        .board-stage { padding: 8px; }
        .board-stage::before { inset: 3px; }
        .board-grid {
          grid-template-columns: 19px minmax(0, 1fr) 19px;
          grid-template-rows: 19px auto 19px;
        }
        .coordinates { font-size: 12px; }
        .opponent { margin-bottom: 12px; }
        .opponent img { width: 48px; height: 48px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        var boardEl = document.getElementById("board");
        var turnLabel = document.getElementById("turnLabel");
        var statusText = document.getElementById("statusText");
        var newGameButton = document.getElementById("newGame");
        var promotionLayer = document.getElementById("promotion");
        var promotionOptions = document.getElementById("promotionOptions");
        var files = ["a", "b", "c", "d", "e", "f", "g", "h"];
        var pieceArt = {
          king: '<path class="main" d="M44 8h12v11h10v11H56v8c12 3 20 14 20 28 0 8-3 14-8 18H32c-5-4-8-10-8-18 0-14 8-25 20-28v-8H34V19h10Z"/><path class="deep" d="M28 70h44l-4 14H32Z"/><path class="highlight" d="M39 44c-5 5-8 12-8 20h8c0-8 3-14 8-18Z"/><path class="accent" d="M32 68h36M34 78h32"/>',
          queen: '<circle class="main" cx="23" cy="22" r="7"/><circle class="main" cx="50" cy="15" r="7"/><circle class="main" cx="77" cy="22" r="7"/><path class="main" d="M21 29l12 18 17-25 17 25 12-18-7 42H28Z"/><path class="highlight" d="M34 47l8-12 3 31H34Z"/><path class="deep" d="M27 70h46l-5 15H32Z"/><path class="accent" d="M30 70h40M34 78h32"/>',
          rook: '<path class="main" d="M22 15h14v12h9V15h10v12h9V15h14v24l-10 8 6 35H26l6-35-10-8Z"/><path class="highlight" d="M35 44h11l-5 30H31Z"/><path class="deep" d="M27 69h46l3 13H24Z"/><path class="accent" d="M30 48h40M28 70h44"/>',
          bishop: '<path class="main" d="M50 12c15 14 22 25 22 36 0 9-5 16-13 20l12 14H29l12-14c-8-4-13-11-13-20 0-11 7-22 22-36Z"/><path class="highlight" d="M45 29c-7 8-10 15-10 21 0 6 3 10 8 13l5-7Z"/><path class="deep" d="M31 71h38l5 11H26Z"/><path class="accent" d="M57 29L43 55M34 69h32"/>',
          knight: '<path class="main" d="M25 82c4-19 12-31 24-39l-12-6 7-22c24 6 36 22 34 45-1 9-5 16-12 22Z"/><path class="deep" d="M30 70h41l8 12H25Z"/><path class="highlight" d="M47 22l-4 12 12 5c-10 8-16 17-19 29h9c5-17 14-23 22-30-5-8-11-13-20-16Z"/><circle class="accent" cx="57" cy="30" r="3"/><path class="accent" d="M48 53c8 0 14 3 18 8M31 70h39"/>',
          pawn: '<circle class="main" cx="50" cy="25" r="15"/><path class="main" d="M41 39h18c1 11 5 21 12 30l5 13H24l5-13c7-9 11-19 12-30Z"/><path class="highlight" d="M43 15c-6 3-9 8-9 14 0 4 2 7 4 9l8-3c-3-6-1-13 4-18Z"/><path class="deep" d="M29 68h42l5 14H24Z"/><path class="accent" d="M31 68h38M29 77h42"/>'
        };
        var names = { king: "король", queen: "ферзь", rook: "ладья", bishop: "слон", knight: "конь", pawn: "пешка" };
        var pieceValues = { pawn: 100, knight: 320, bishop: 330, rook: 500, queen: 900, king: 20000 };
        var state;
        var computerTimer = null;

        function piece(type, color) {
          return { type: type, color: color, moved: false };
        }

        function createPieceGraphic(type, color) {
          var wrapper = document.createElement("span");
          wrapper.className = "piece " + color;
          wrapper.setAttribute("aria-hidden", "true");
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("focusable", "false");
          svg.innerHTML = pieceArt[type];
          wrapper.appendChild(svg);
          return wrapper;
        }

        function initialBoard() {
          var b = [];
          var back = ["rook", "knight", "bishop", "queen", "king", "bishop", "knight", "rook"];
          for (var r = 0; r < 8; r++) {
            b[r] = [];
            for (var c = 0; c < 8; c++) b[r][c] = null;
          }
          for (var i = 0; i < 8; i++) {
            b[0][i] = piece(back[i], "black");
            b[1][i] = piece("pawn", "black");
            b[6][i] = piece("pawn", "white");
            b[7][i] = piece(back[i], "white");
          }
          return b;
        }

        function resetGame() {
          if (computerTimer !== null) {
            clearTimeout(computerTimer);
            computerTimer = null;
          }
          state = {
            board: initialBoard(),
            turn: "white",
            selected: null,
            legalMoves: [],
            lastMove: null,
            enPassant: null,
            pendingPromotion: null,
            computerThinking: false,
            finished: false
          };
          promotionLayer.classList.remove("open");
          setMessage("Ход белых", "Выберите фигуру, затем клетку");
          render();
        }

        function setMessage(title, detail) {
          turnLabel.textContent = title;
          statusText.textContent = detail;
        }

        function cloneBoard(b) {
          return b.map(function (row) {
            return row.map(function (p) {
              return p ? { type: p.type, color: p.color, moved: p.moved } : null;
            });
          });
        }

        function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }
        function enemy(color) { return color === "white" ? "black" : "white"; }
        function squareName(r, c) { return files[c] + (8 - r); }

        function findKing(b, color) {
          for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
              var p = b[r][c];
              if (p && p.color === color && p.type === "king") return { r: r, c: c };
            }
          }
          return null;
        }

        function isSquareAttacked(b, r, c, byColor) {
          var pawnRow = byColor === "white" ? r + 1 : r - 1;
          for (var pc = c - 1; pc <= c + 1; pc += 2) {
            if (inBounds(pawnRow, pc)) {
              var pp = b[pawnRow][pc];
              if (pp && pp.color === byColor && pp.type === "pawn") return true;
            }
          }

          var knightSteps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
          for (var n = 0; n < knightSteps.length; n++) {
            var nr = r + knightSteps[n][0], nc = c + knightSteps[n][1];
            if (inBounds(nr,nc)) {
              var np = b[nr][nc];
              if (np && np.color === byColor && np.type === "knight") return true;
            }
          }

          var lines = [
            [-1,0,"rook"], [1,0,"rook"], [0,-1,"rook"], [0,1,"rook"],
            [-1,-1,"bishop"], [-1,1,"bishop"], [1,-1,"bishop"], [1,1,"bishop"]
          ];
          for (var d = 0; d < lines.length; d++) {
            var rr = r + lines[d][0], cc = c + lines[d][1];
            while (inBounds(rr,cc)) {
              var lp = b[rr][cc];
              if (lp) {
                if (lp.color === byColor && (lp.type === lines[d][2] || lp.type === "queen")) return true;
                break;
              }
              rr += lines[d][0]; cc += lines[d][1];
            }
          }

          for (var kr = -1; kr <= 1; kr++) {
            for (var kc = -1; kc <= 1; kc++) {
              if (!kr && !kc) continue;
              var ar = r + kr, ac = c + kc;
              if (inBounds(ar,ac)) {
                var kp = b[ar][ac];
                if (kp && kp.color === byColor && kp.type === "king") return true;
              }
            }
          }
          return false;
        }

        function isInCheck(b, color) {
          var king = findKing(b, color);
          return king ? isSquareAttacked(b, king.r, king.c, enemy(color)) : false;
        }

        function pushStep(moves, b, color, r, c, extra) {
          if (!inBounds(r,c)) return false;
          var target = b[r][c];
          if (!target) {
            moves.push(Object.assign({ r: r, c: c }, extra || {}));
            return true;
          }
          if (target.color !== color && target.type !== "king") moves.push(Object.assign({ r: r, c: c, capture: true }, extra || {}));
          return false;
        }

        function pseudoMoves(b, r, c, ep, includeCastling) {
          var p = b[r][c];
          if (!p) return [];
          var moves = [];
          var i, rr, cc;

          if (p.type === "pawn") {
            var dir = p.color === "white" ? -1 : 1;
            var start = p.color === "white" ? 6 : 1;
            if (inBounds(r + dir, c) && !b[r + dir][c]) {
              moves.push({ r: r + dir, c: c, promotion: r + dir === 0 || r + dir === 7 });
              if (r === start && !b[r + 2 * dir][c]) moves.push({ r: r + 2 * dir, c: c, doublePawn: true });
            }
            for (i = -1; i <= 1; i += 2) {
              rr = r + dir; cc = c + i;
              if (!inBounds(rr,cc)) continue;
              if (b[rr][cc] && b[rr][cc].color !== p.color && b[rr][cc].type !== "king") {
                moves.push({ r: rr, c: cc, capture: true, promotion: rr === 0 || rr === 7 });
              } else if (ep && ep.r === rr && ep.c === cc && ep.color !== p.color) {
                moves.push({ r: rr, c: cc, capture: true, enPassant: true, capturedR: ep.pawnR, capturedC: ep.pawnC });
              }
            }
          } else if (p.type === "knight") {
            var steps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
            for (i = 0; i < steps.length; i++) pushStep(moves,b,p.color,r+steps[i][0],c+steps[i][1]);
          } else if (p.type === "bishop" || p.type === "rook" || p.type === "queen") {
            var dirs = [];
            if (p.type !== "rook") dirs = dirs.concat([[-1,-1],[-1,1],[1,-1],[1,1]]);
            if (p.type !== "bishop") dirs = dirs.concat([[-1,0],[1,0],[0,-1],[0,1]]);
            for (i = 0; i < dirs.length; i++) {
              rr = r + dirs[i][0]; cc = c + dirs[i][1];
              while (pushStep(moves,b,p.color,rr,cc)) { rr += dirs[i][0]; cc += dirs[i][1]; }
            }
          } else if (p.type === "king") {
            for (var dr = -1; dr <= 1; dr++) {
              for (var dc = -1; dc <= 1; dc++) {
                if (dr || dc) pushStep(moves,b,p.color,r+dr,c+dc);
              }
            }
            if (includeCastling && !p.moved && !isInCheck(b,p.color)) {
              var opponent = enemy(p.color);
              var rookK = b[r][7];
              if (rookK && rookK.type === "rook" && rookK.color === p.color && !rookK.moved && !b[r][5] && !b[r][6] && !isSquareAttacked(b,r,5,opponent) && !isSquareAttacked(b,r,6,opponent)) {
                moves.push({ r: r, c: 6, castle: "king" });
              }
              var rookQ = b[r][0];
              if (rookQ && rookQ.type === "rook" && rookQ.color === p.color && !rookQ.moved && !b[r][1] && !b[r][2] && !b[r][3] && !isSquareAttacked(b,r,3,opponent) && !isSquareAttacked(b,r,2,opponent)) {
                moves.push({ r: r, c: 2, castle: "queen" });
              }
            }
          }
          return moves;
        }

        function applyToBoard(b, fromR, fromC, move, promotionType) {
          var moving = b[fromR][fromC];
          b[fromR][fromC] = null;
          if (move.enPassant) b[move.capturedR][move.capturedC] = null;
          b[move.r][move.c] = moving;
          moving.moved = true;
          if (move.castle === "king") {
            b[move.r][5] = b[move.r][7];
            b[move.r][7] = null;
            b[move.r][5].moved = true;
          } else if (move.castle === "queen") {
            b[move.r][3] = b[move.r][0];
            b[move.r][0] = null;
            b[move.r][3].moved = true;
          }
          if (move.promotion && promotionType) moving.type = promotionType;
        }

        function legalMovesFor(b, r, c, ep) {
          var p = b[r][c];
          if (!p) return [];
          return pseudoMoves(b,r,c,ep,true).filter(function (move) {
            var test = cloneBoard(b);
            applyToBoard(test,r,c,move,move.promotion ? "queen" : null);
            return !isInCheck(test,p.color);
          });
        }

        function allLegalMovesFor(b, color, ep) {
          var all = [];
          for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
              var p = b[r][c];
              if (!p || p.color !== color) continue;
              var moves = legalMovesFor(b,r,c,ep);
              for (var i = 0; i < moves.length; i++) {
                all.push({ fromR: r, fromC: c, move: moves[i] });
              }
            }
          }
          return all;
        }

        function allLegalMoves(color) {
          return allLegalMovesFor(state.board,color,state.enPassant);
        }

        function nextEnPassant(fromR, move, color) {
          return move.doublePawn ? {
            r: (fromR + move.r) / 2,
            c: move.c,
            pawnR: move.r,
            pawnC: move.c,
            color: color
          } : null;
        }

        function evaluateBoard(b) {
          var score = 0;
          for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
              var p = b[r][c];
              if (!p) continue;
              var value = pieceValues[p.type];
              var center = 7 - (Math.abs(3.5 - r) + Math.abs(3.5 - c));
              var activity = p.type === "pawn" ? center * 2 : center * 3;
              score += p.color === "black" ? value + activity : -(value + activity);
            }
          }
          return score;
        }

        function chooseComputerMove() {
          var candidates = allLegalMovesFor(state.board,"black",state.enPassant);
          var bestScore = -Infinity;
          var best = [];

          for (var i = 0; i < candidates.length; i++) {
            var candidate = candidates[i];
            var afterBlack = cloneBoard(state.board);
            var moving = afterBlack[candidate.fromR][candidate.fromC];
            applyToBoard(afterBlack,candidate.fromR,candidate.fromC,candidate.move,candidate.move.promotion ? "queen" : null);
            var ep = nextEnPassant(candidate.fromR,candidate.move,moving.color);
            var replies = allLegalMovesFor(afterBlack,"white",ep);
            var score;

            if (!replies.length) {
              score = isInCheck(afterBlack,"white") ? 100000 : 0;
            } else {
              score = Infinity;
              for (var j = 0; j < replies.length; j++) {
                var reply = replies[j];
                var afterWhite = cloneBoard(afterBlack);
                applyToBoard(afterWhite,reply.fromR,reply.fromC,reply.move,reply.move.promotion ? "queen" : null);
                var replyScore = evaluateBoard(afterWhite);
                if (isInCheck(afterWhite,"black")) replyScore -= 22;
                if (replyScore < score) score = replyScore;
              }
            }

            if (isInCheck(afterBlack,"white")) score += 18;
            score += Math.random() * 12;
            if (score > bestScore + 0.01) {
              bestScore = score;
              best = [candidate];
            } else if (Math.abs(score - bestScore) <= 0.01) {
              best.push(candidate);
            }
          }

          return best.length ? best[Math.floor(Math.random() * best.length)] : null;
        }

        function scheduleComputerMove() {
          if (state.finished || state.turn !== "black") return;
          state.computerThinking = true;
          setMessage("Ход чёрных", "Компьютер думает…");
          render();
          computerTimer = setTimeout(function () {
            computerTimer = null;
            if (state.finished || state.turn !== "black") return;
            var choice = chooseComputerMove();
            state.computerThinking = false;
            if (choice) {
              completeMove(
                { r: choice.fromR, c: choice.fromC },
                choice.move,
                choice.move.promotion ? "queen" : null
              );
            }
          }, 180);
        }

        function completeMove(from, move, promotionType) {
          var movedPiece = state.board[from.r][from.c];
          applyToBoard(state.board,from.r,from.c,move,promotionType);
          state.lastMove = { fromR: from.r, fromC: from.c, toR: move.r, toC: move.c };
          state.enPassant = move.doublePawn ? {
            r: (from.r + move.r) / 2,
            c: move.c,
            pawnR: move.r,
            pawnC: move.c,
            color: movedPiece.color
          } : null;
          state.selected = null;
          state.legalMoves = [];
          state.pendingPromotion = null;
          state.turn = enemy(state.turn);

          var options = allLegalMoves(state.turn);
          var checked = isInCheck(state.board,state.turn);
          if (!options.length) {
            state.finished = true;
            if (checked) {
              setMessage("Мат", (state.turn === "white" ? "Чёрные" : "Белые") + " выиграли");
            } else {
              setMessage("Пат", "Ничья — допустимых ходов нет");
            }
          } else {
            var who = state.turn === "white" ? "белых" : "чёрных";
            setMessage("Ход " + who, checked ? "Шах королю" : "Выберите фигуру, затем клетку");
          }
          render();
          if (!state.finished && state.turn === "black") scheduleComputerMove();
        }

        function openPromotion(from, move) {
          state.pendingPromotion = { from: from, move: move };
          promotionOptions.innerHTML = "";
          ["queen","rook","bishop","knight"].forEach(function (type) {
            var button = document.createElement("button");
            button.type = "button";
            button.appendChild(createPieceGraphic(type, state.turn));
            button.setAttribute("aria-label", names[type]);
            button.addEventListener("click", function () {
              promotionLayer.classList.remove("open");
              completeMove(from,move,type);
            });
            promotionOptions.appendChild(button);
          });
          promotionLayer.classList.add("open");
          setTimeout(function () {
            var first = promotionOptions.querySelector("button");
            if (first) first.focus();
          }, 0);
        }

        function selectSquare(r,c) {
          if (state.finished || state.pendingPromotion || state.computerThinking || state.turn !== "white") return;
          var p = state.board[r][c];
          var selectedMove = null;
          if (state.selected) {
            for (var i = 0; i < state.legalMoves.length; i++) {
              if (state.legalMoves[i].r === r && state.legalMoves[i].c === c) {
                selectedMove = state.legalMoves[i]; break;
              }
            }
          }
          if (selectedMove) {
            var from = { r: state.selected.r, c: state.selected.c };
            if (selectedMove.promotion) openPromotion(from,selectedMove);
            else completeMove(from,selectedMove,null);
            return;
          }
          if (p && p.color === state.turn) {
            state.selected = { r: r, c: c };
            state.legalMoves = legalMovesFor(state.board,r,c,state.enPassant);
            statusText.textContent = names[p.type].charAt(0).toUpperCase() + names[p.type].slice(1) + " на " + squareName(r,c) + ": выберите ход";
          } else {
            state.selected = null;
            state.legalMoves = [];
            statusText.textContent = "Сейчас ход " + (state.turn === "white" ? "белых" : "чёрных");
          }
          render();
        }

        function renderCoordinates() {
          document.querySelectorAll(".coordinates.files").forEach(function (el) {
            el.innerHTML = files.map(function (f) { return "<span>" + f + "</span>"; }).join("");
          });
          document.querySelectorAll(".coordinates.ranks").forEach(function (el) {
            el.innerHTML = [8,7,6,5,4,3,2,1].map(function (n) { return "<span>" + n + "</span>"; }).join("");
          });
        }

        function render() {
          boardEl.innerHTML = "";
          var checkKing = isInCheck(state.board,state.turn) ? findKing(state.board,state.turn) : null;
          for (var r = 0; r < 8; r++) {
            for (var c = 0; c < 8; c++) {
              var sq = document.createElement("button");
              sq.type = "button";
              sq.className = "square " + ((r+c)%2 ? "dark" : "light");
              sq.setAttribute("role","gridcell");
              sq.dataset.r = r;
              sq.dataset.c = c;
              var p = state.board[r][c];
              var label = squareName(r,c);
              if (p) label += ", " + (p.color === "white" ? "белые, " : "чёрные, ") + names[p.type];
              sq.setAttribute("aria-label",label);

              if (state.selected && state.selected.r === r && state.selected.c === c) sq.classList.add("selected");
              for (var i = 0; i < state.legalMoves.length; i++) {
                var m = state.legalMoves[i];
                if (m.r === r && m.c === c) {
                  sq.classList.add("legal");
                  if (m.capture) sq.classList.add("capture");
                }
              }
              if (state.lastMove && ((state.lastMove.fromR === r && state.lastMove.fromC === c) || (state.lastMove.toR === r && state.lastMove.toC === c))) sq.classList.add("last-move");
              if (checkKing && checkKing.r === r && checkKing.c === c) sq.classList.add("in-check");

              if (p) sq.appendChild(createPieceGraphic(p.type, p.color));
              sq.addEventListener("click",(function (row,col) {
                return function () { selectSquare(row,col); };
              })(r,c));
              boardEl.appendChild(sq);
            }
          }
        }

        newGameButton.addEventListener("click",resetGame);
        renderCoordinates();
        resetGame();
      })();
    </script>
  </body>
</html>
