.hotspot{position:absolute;z-index:6;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;color:#fff}.hotspot .pin{width:42px;height:42px;margin:auto;display:grid;place-items:center;border:1px solid #e6c77b;border-radius:50%;background:#16202cdb;box-shadow:0 5px 15px #0009,inset 0 0 0 3px #9a743540;transition:transform .16s ease,background .16s ease}.hotspot svg{width:22px;height:22px;color:#ffe4a3}.hotspot .name{display:block;margin-top:5px;padding:4px 8px;background:#15110ddb;border:1px solid #ae8748;color:#fff1d0;font:600 10px Cinzel,serif;white-space:nowrap;box-shadow:0 3px 9px #0008}.hotspot:hover .pin,.hotspot:focus-visible .pin{transform:translateY(-4px);background:#704c20}.keep-spot{left:48%;top:39%}.farm-spot{left:15%;top:68%}.sawmill-spot{left:42%;top:69%}.quarry-spot{left:73%;top:55%}.barracks-spot{left:74%;top:34%}.house-spot{left:29%;top:53%}
.city-note{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));padding:8px 11px;background:#12100cbc;color:#f1e2c5;border-left:3px solid #cba051;font-size:11px;box-shadow:0 5px 15px #0007;backdrop-filter:blur(5px)}
.scrim{position:absolute;z-index:30;inset:0;background:#0605049c;opacity:0;pointer-events:none;transition:opacity .18s ease}.scrim.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:31;top:78px;right:18px;bottom:18px;width:min(420px,calc(100% - 36px));background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(calc(100% + 32px));transition:transform .22s ease;overflow:auto}.sheet.open{transform:translateX(0)}.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 20px 16px;background:var(--paper);border-bottom:1px solid color-mix(in srgb,var(--line) 56%,transparent)}.eyebrow{display:block;margin-bottom:3px;color:var(--gold-deep);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.13em}.sheet h1{font:700 23px Cinzel,serif;margin:0}.close{width:35px;height:35px;flex:0 0 auto;border:1px solid var(--line);background:transparent;font-size:23px;line-height:1;cursor:pointer}.sheet-body{padding:18px 20px 24px}.description{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 18px}.level-block{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;padding-bottom:15px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}.level-block small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.level-block strong{font:700 28px Cinzel,serif;color:var(--gold-deep)}.level-block .effect{text-align:right;font-weight:700;font-size:12px;color:var(--green)}.section-title{font:700 13px Cinzel,serif;margin:20px 0 10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:11px 12px;background:var(--paper-2);border:1px solid color-mix(in srgb,var(--line) 50%,transparent)}.stat span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.stat b{font-size:13px}.costs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.cost{padding:6px 8px;background:var(--night);color:#f4e4c2;font-size:10px;border:1px solid var(--line)}.primary{width:100%;border:1px solid #644316;background:linear-gradient(#ddb359,#a76f23);color:#fff9e8;padding:12px 15px;font:700 12px Cinzel,serif;cursor:pointer;box-shadow:inset 0 1px #ffe3a3}.primary:disabled{filter:grayscale(1);opacity:.55;cursor:not-allowed}.secondary{width:100%;margin-top:8px;border:1px solid var(--line);background:transparent;padding:10px 14px;font:700 11px Cinzel,serif;cursor:pointer}.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 35%,transparent)}.row:last-child{border-bottom:0}.row h3{font:700 13px Cinzel,serif;margin:0 0 4px}.row p{font-size:11px;color:var(--muted);margin:0;line-height:1.4}.row button{border:1px solid var(--line);background:var(--paper-2);padding:8px 10px;font-weight:700;font-size:10px;cursor:pointer}.row button:disabled{opacity:.5}.general-card{display:grid;grid-template-columns:76px 1fr;gap:15px;align-items:center;margin-bottom:18px}.portrait{width:76px;height:88px;display:grid;place-items:center;background:#233248;border:1px solid var(--line);color:#f1cf82}.portrait svg{width:43px;height:43px}.general-card h2{font:700 17px Cinzel,serif;margin:0 0 5px}.general-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.45}.meter{height:7px;margin-top:9px;background:#16120e;overflow:hidden}.meter i{display:block;height:100%;width:42%;background:var(--gold)}.toast{position:absolute;z-index:50;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,24px);background:#17120e;color:#ffebbd;border:1px solid #d8a94a;padding:10px 16px;box-shadow:0 9px 25px #000a;opacity:0;transition:.2s;pointer-events:none;font-size:12px;max-width:calc(100% - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.city{background-size:auto 118%;background-position:50% 47%}.hud{min-height:100px;grid-template-columns:repeat(4,1fr);padding:46px 8px 0}.realm{position:absolute;left:8px;right:67px;top:0;height:45px;padding:4px 7px;border-right:0;border-bottom:1px solid #d2a96128}.crest{width:31px;height:31px}.crest svg{width:18px;height:18px}.realm strong{font-size:12px}.realm small{font-size:9px}.resource{padding:7px 5px;border-right:1px solid #d2a96124}.resource span{font-size:7px}.resource b{font-size:11px}.resource em{display:none}.settings{top:5px;right:8px;width:36px;height:36px}.menu-rail{top:116px;right:8px;width:61px}.menu-button{min-height:61px}.menu-button svg{width:22px;height:22px}.menu-button span{font-size:8px}.hotspot .pin{width:38px;height:38px}.hotspot .name{font-size:9px;padding:3px 6px}.keep-spot{left:47%;top:36%}.farm-spot{left:15%;top:63%}.sawmill-spot{left:43%;top:68%}.quarry-spot{left:72%;top:55%}.barracks-spot{left:73%;top:33%}.house-spot{left:26%;top:49%}.city-note{display:none}.sheet{top:auto;right:0;left:0;bottom:0;width:100%;max-height:70svh;border-width:1px 0 0;transform:translateY(105%)}.sheet.open{transform:translateY(0)}.sheet-head{padding:15px 16px 12px}.sheet h1{font-size:19px}.sheet-body{padding:14px 16px calc(20px + env(safe-area-inset-bottom))}.stats{gap:6px}.menu-rail.panel-active{display:none}}
@media(max-width:420px){.hotspot .name{display:none}.hotspot:focus .name{display:block}.farm-spot{left:14%;top:63%}.sawmill-spot{left:40%;top:67%}.quarry-spot{left:69%;top:58%}.barracks-spot{left:72%;top:35%}.house-spot{left:25%;top:49%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.sheet,.scrim,.toast,.hotspot .pin{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="city" aria-label="City of Asterfall">
    <button class="hotspot keep-spot" data-building="Keep" aria-label="Open Keep"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9h3V4h3v5h4V4h3v5h3v12M2 21h20M9 21v-5h6v5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">Keep</span></button>
    <button class="hotspot farm-spot" data-building="Farm" aria-label="Open Farm"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V7M12 9C8 9 6 7 6 4c4 0 6 2 6 5Zm0 5c4 0 6-2 6-5-4 0-6 2-6 5Zm0 5c-4 0-6-2-6-5 4 0 6 2 6 5Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">Farm</span></button>
    <button class="hotspot sawmill-spot" data-building="Sawmill" aria-label="Open Sawmill"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M6 18V9l6-5 6 5v9M9 18v-5h6v5M3 21h18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">Sawmill</span></button>
    <button class="hotspot quarry-spot" data-building="Quarry" aria-label="Open Quarry"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 3-9 5-3 6 5-3 7H5Zm4-9 4 3 6-1" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">Quarry</span></button>
    <button class="hotspot barracks-spot" data-building="Barracks" aria-label="Open Barracks"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 14 16M19 4 5 20M5 4l3 1-2 2-1-3Zm14 0-3 1 2 2 1-3Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">Barracks</span></button>
    <button class="hotspot house-spot" data-building="House" aria-label="Open House"><span class="pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7M5 10v10h14V10M10 20v-6h4v6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="name">House</span></button>
  </div>

  <header class="hud">
    <div class="realm"><span class="crest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9h3V4h3v5h4V4h3v5h3v12M2 21h20" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><div><strong>Asterfall</strong><small id="realmLine">Village Age · Keep Lv. 1</small></div></div>
    <div class="resource"><span>Food</span><b id="food">1,600 <em>+12/m</em></b></div>
    <div class="resource"><span>Wood</span><b id="wood">1,250 <em>+10/m</em></b></div>
    <div class="resource"><span>Stone</span><b id="stone">900 <em>+8/m</em></b></div>
    <div class="resource"><span>Gold</span><b id="gold">620 <em>+8/m</em></b></div>
  </header>

  <button class="settings" id="settingsBtn" aria-label="Open kingdom overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.5 4a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.5 1a9 9 0 0 0-1.8-1L15.7 3h-4L11.2 6a9 9 0 0 0-1.8 1L7 6 5 9.4 7 11a7 7 0 0 0 0 2l-2 1.6L7 18l2.4-1a9 9 0 0 0 1.8 1l.5 3h4l.4-3a9 9 0 0 0 1.8-1l2.5 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>

  <nav class="menu-rail" id="menuRail" aria-label="Kingdom menu">
    <button class="menu-button" data-panel="general"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21v-2a6 6 0 0 1 12 0v2M8 7a4 4 0 1 0 8 0M7 7h10l-2-4H9L7 7Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>General</span></button>
    <button class="menu-button" data-panel="army"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 18M19 3 5 21M4 3l4 1-3 3-1-4Zm16 0-4 1 3 3 1-4Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Army</span></button>
    <button class="menu-button" data-panel="research"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Zm3 0v16M11 8h5M11 12h5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Research</span></button>
  </nav>

  <div class="city-note">Select a building to manage it</div>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><div><span class="eyebrow" id="sheetEyebrow">Building</span><h1 id="sheetTitle">Keep</h1></div><button class="close" id="closeBtn" aria-label="Close panel">×</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
const state={food:1600,wood:1250,stone:900,gold:620,general:7,spearmen:8,archers:4,knights:0,research:{},buildings:{Keep:1,Farm:1,Sawmill:1,Quarry:1,Barracks:1,House:1}};
const buildingInfo={
 Keep:{desc:'The heart of Asterfall. Its level sets the limit for every other building.',effect:'Building limit +1',stats:[['City capacity','6 buildings'],['March slots','2'],['Realm power','112']],cost:[180,140,0,80]},
 Farm:{desc:'Feeds the settlement and keeps troops supplied for longer marches.',effect:'Food +12/min',stats:[['Hourly yield','720 food'],['Storage','3,200'],['Workers','14']],cost:[70,30,0,15]},
 Sawmill:{desc:'Processes timber for construction, fortifications, and military equipment.',effect:'Wood +10/min',stats:[['Hourly yield','600 wood'],['Storage','2,800'],['Workers','11']],cost:[80,35,0,15]},
 Quarry:{desc:'Cuts stone used to strengthen the Keep and the city walls.',effect:'Stone +8/min',stats:[['Hourly yield','480 stone'],['Storage','2,400'],['Workers','9']],cost:[90,25,0,20]},
 Barracks:{desc:'Trains and organizes the soldiers who defend Asterfall.',effect:'Training speed +5%',stats:[['Training queue','Idle'],['Army size','12'],['Troop power','28']],cost:[140,100,0,45]},
 House:{desc:'Provides homes for citizens and raises the city population limit.',effect:'Population +20',stats:[['Population','42 / 80'],['Happiness','Good'],['Gold tax','4/min']],cost:[90,40,0,20]}
};
const $=id=>document.getElementById(id);let active=null,lastFocus=null;
function fmt(n){return Math.floor(n).toLocaleString()}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function canPay(cost){return state.wood>=cost[0]&&state.stone>=cost[1]&&state.food>=cost[2]&&state.gold>=cost[3]}
function pay(cost){state.wood-=cost[0];state.stone-=cost[1];state.food-=cost[2];state.gold-=cost[3]}
function scaledCost(name){const base=buildingInfo[name].cost;const mult=Math.pow(1.55,state.buildings[name]-1);return base.map(n=>Math.round(n*mult))}
function updateHud(){const gains={food:12*state.buildings.Farm,wood:10*state.buildings.Sawmill,stone:8*state.buildings.Quarry,gold:4*state.buildings.House+4};['food','wood','stone','gold'].forEach(key=>{$(key).innerHTML=fmt(state[key])+' <em>+'+gains[key]+'/m</em>'});$('realmLine').textContent='Village Age · Keep Lv. '+state.buildings.Keep}
function costsMarkup(c){return c.map((v,i)=>v?'<span class="cost">'+v+' '+['wood','stone','food','gold'][i]+'</span>':'').join('')}
function openPanel(type,label){lastFocus=document.activeElement;active={type:type,label:label};renderPanel();$('scrim').classList.add('open');$('sheet').classList.add('open');$('menuRail').classList.add('panel-active');setTimeout(()=>$('closeBtn').focus(),20)}
function closePanel(){$('scrim').classList.remove('open');$('sheet').classList.remove('open');$('menuRail').classList.remove('panel-active');active=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function renderPanel(){if(!active)return;if(active.type==='building')renderBuilding(active.label);else if(active.type==='general')renderGeneral();else if(active.type==='army')renderArmy();else if(active.type==='research')renderResearch();else renderOverview()}
function renderBuilding(name){const info=buildingInfo[name],level=state.buildings[name],cost=scaledCost(name);$('sheetEyebrow').textContent='Building';$('sheetTitle').textContent=name;$('sheetBody').innerHTML='<p class="description">'+info.desc+'</p><div class="level-block"><div><small>Current level</small><strong>'+level+'</strong></div><div class="effect">'+info.effect+'</div></div><h2 class="section-title">Configuration</h2><div class="stats">'+info.stats.map(s=>'<div class="stat"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>').join('')+'</div><h2 class="section-title">Upgrade to level '+(level+1)+'</h2><div class="costs">'+costsMarkup(cost)+'</div><button class="primary" id="upgradeBuilding" '+(!canPay(cost)?'disabled':'')+'>Upgrade '+name+'</button>'+(name==='Barracks'?'<button class="secondary" data-switch="army">Open Army</button>':'')}
function renderGeneral(){$('sheetEyebrow').textContent='Commander';$('sheetTitle').textContent='General';const cost=[0,0,0,state.general*45];$('sheetBody').innerHTML='<div class="general-card"><div class="portrait"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21v-2a6 6 0 0 1 12 0v2M8 7a4 4 0 1 0 8 0M7 7h10l-2-4H9L7 7Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div><div><h2>Rowan the Steadfast</h2><p>Defense specialist · Level '+state.general+'</p><div class="meter"><i></i></div></div></div><div class="stats"><div class="stat"><span>Leadership</span><b>'+ (31+state.general*2) +'</b></div><div class="stat"><span>Defense bonus</span><b>+'+(6+state.general)+'%</b></div><div class="stat"><span>Army capacity</span><b>'+(40+state.general*5)+'</b></div><div class="stat"><span>Experience</span><b>420 / 1,000</b></div></div><h2 class="section-title">Upgrade to level '+(state.general+1)+'</h2><div class="costs">'+costsMarkup(cost)+'</div><button class="primary" id="upgradeGeneral" '+(!canPay(cost)?'disabled':'')+'>Upgrade General</button>'}
function renderArmy(){$('sheetEyebrow').textContent='Military';$('sheetTitle').textContent='Army';$('sheetBody').innerHTML='<p class="description">Train troops at the Barracks. Each order is added immediately to your garrison.</p>'+armyRow('Spearmen','Reliable city defenders.',state.spearmen,'spearmen','150 food · 100 gold')+armyRow('Archers','Strong from walls and towers.',state.archers,'archers','200 food · 150 wood')+armyRow('Knights','Elite cavalry. Requires Keep level 3.',state.knights,'knights','160 food · 150 gold')}
function armyRow(title,desc,count,key,cost){const locked=key==='knights'&&state.buildings.Keep<3;return '<div class="row"><div><h3>'+title+' · '+count+'</h3><p>'+desc+'<br>'+cost+'</p></div><button data-train="'+key+'" '+(locked?'disabled':'')+'>'+(locked?'Locked':'Train')+'</button></div>'}
function renderResearch(){$('sheetEyebrow').textContent='Academy';$('sheetTitle').textContent='Research';const rows=[['Iron Tools','Production +15%',220],['Fletching','Archer power +25%',180],['Masonry','Building defense +30%',200]];$('sheetBody').innerHTML='<p class="description">Develop one permanent improvement at a time for the current session.</p>'+rows.map(r=>'<div class="row"><div><h3>'+r[0]+'</h3><p>'+r[1]+' · '+r[2]+' gold</p></div><button data-research="'+r[0]+'" data-cost="'+r[2]+'" '+(state.research[r[0]]?'disabled':'')+'>'+(state.research[r[0]]?'Done':'Research')+'</button></div>').join('')}
function renderOverview(){$('sheetEyebrow').textContent='Realm';$('sheetTitle').textContent='Asterfall';const levels=Object.values(state.buildings).reduce((a,b)=>a+b,0);$('sheetBody').innerHTML='<p class="description">A compact overview of your city. Close this panel to return to the clean city view.</p><div class="stats"><div class="stat"><span>Building levels</span><b>'+levels+'</b></div><div class="stat"><span>Army</span><b>'+(state.spearmen+state.archers+state.knights)+'</b></div><div class="stat"><span>General</span><b>Level '+state.general+'</b></div><div class="stat"><span>Research</span><b>'+Object.keys(state.research).length+' / 3</b></div></div>'}
function upgradeBuilding(){const name=active.label,cost=scaledCost(name);if(!canPay(cost)){toast('Not enough resources');return}pay(cost);state.buildings[name]++;updateHud();renderBuilding(name);toast(name+' upgraded to level '+state.buildings[name])}
function train(key){let c,qty=5;if(key==='spearmen')c=[0,0,150,100];if(key==='archers')c=[150,0,200,0];if(key==='knights'){c=[0,0,160,150];qty=2}if(!canPay(c)){toast('Not enough resources');return}pay(c);state[key]+=qty;updateHud();renderArmy();toast(qty+' '+key+' trained')}
function research(name,cost){const c=[0,0,0,cost];if(!canPay(c)){toast('Not enough gold');return}pay(c);state.research[name]=true;updateHud();renderResearch();toast(name+' completed')}
document.addEventListener('click',function(e){const building=e.target.closest('[data-building]');if(building){openPanel('building',building.dataset.building);return}const panel=e.target.closest('[data-panel]');if(panel){openPanel(panel.dataset.panel);return}if(e.target.closest('#settingsBtn')){openPanel('overview');return}if(e.target.closest('#upgradeBuilding')){upgradeBuilding();return}if(e.target.closest('#upgradeGeneral')){const c=[0,0,0,state.general*45];if(!canPay(c)){toast('Not enough gold');return}pay(c);state.general++;updateHud();renderGeneral();toast('General advanced to level '+state.general);return}const trainBtn=e.target.closest('[data-train]');if(trainBtn){train(trainBtn.dataset.train);return}const researchBtn=e.target.closest('[data-research]');if(researchBtn){research(researchBtn.dataset.research,Number(researchBtn.dataset.cost));return}const switchBtn=e.target.closest('[data-switch]');if(switchBtn){active={type:switchBtn.dataset.switch};renderPanel()}});
$('closeBtn').addEventListener('click',closePanel);$('scrim').addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active)closePanel()});
updateHud();setInterval(function(){state.food+=12/60*state.buildings.Farm;state.wood+=10/60*state.buildings.Sawmill;state.stone+=8/60*state.buildings.Quarry;state.gold+=(4*state.buildings.House+4)/60;updateHud()},1000);
})();
</script>
</body>
</html>
